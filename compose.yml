x-temporal-environment: &temporal_envvars
  TEMPORAL_ADDRESS: "${TEMPORAL_ADDRESS:-temporal:7233}"
  TEMPORAL_NAMESPACE: "${TEMPORAL_NAMESPACE:-default}"
  TEMPORAL_API_KEY: "${TEMPORAL_API_KEY:-}"
  TEMPORAL_TLS: "${TEMPORAL_TLS:-false}"

services:
  zigflow:
    build:
      context: .
    environment:
      <<: *temporal_envvars
      CONVERT_FAILURE_DATA: "${CONVERT_FAILURE_DATA:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
    volumes:
      - ./workflows:/app/workflows:ro
    command:
      - run
      - --watch
    depends_on:
      temporal:
        condition: service_healthy

  temporal:
    image: temporalio/temporal
    ports:
      - 7233:7233
      - 8233:8233
    command: server start-dev --ip 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health"]
      interval: 10s
      timeout: 10s
      retries: 3

  ############
  # Triggers #
  ############

  hello-world: &trigger
    image: temporalio/temporal
    entrypoint: ""
    command: sh /workflows/hello-world/trigger.sh
    environment:
      <<: *temporal_envvars
    volumes:
      - ./workflows:/workflows
    depends_on:
      temporal:
        condition: service_healthy
