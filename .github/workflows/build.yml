name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions: read-all
jobs:
  commitlint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fetch-depth is required

      - uses: wagoid/commitlint-github-action@v6

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '>=1.20.0'

      - uses: pre-commit/action@v3.0.1

  discover:
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.discover.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover workflows
        id: discover
        run: |
          workflows="$(find ./workflows -type f \
            \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) \
            | jq --raw-input --null-input --compact-output '[inputs]')"
          echo "Discovered workflows: ${workflows}"
          echo "workflows=${workflows}" >> "$GITHUB_OUTPUT"

  validate:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workflow: ${{ fromJSON(needs.discover.outputs.workflows) }}
    steps:
      - uses: actions/checkout@v7

      - uses: zigflow/setup-zigflow@v0

      - name: Validate workflow
        env:
          WORKFLOW: ${{ matrix.workflow }}
        run: zigflow validate "$WORKFLOW"
